[project]
name = "helpdesk-ai"
version = "0.1.0"
description = "Helpdesk AI Assistant PoC - auto-kategorisasi + draft FAQ + masking"
readme = "README.md"
requires-python = ">= 3.11"
dependencies = [
  "streamlit==1.40.0",
  "pandas==2.2.3",
  "python-dotenv==1.0.1",
  "openai==1.54.0",
  "google-genai>=1.0",
]

[dependency-groups]
dev = [
  "ruff>=0.14",
]

[tool.ruff]
target-version = "py311"
lint.select = ["E", "F", "I"]
lint.ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.uv]
package = false
